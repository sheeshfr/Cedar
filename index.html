  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function() {
      try {
        var p = window.location.pathname || '';
        if (/\/help\/?$/i.test(p)) {
          var base = document.createElement('base');
          base.href = p.replace(/\/help\/?$/i, '/') || '/';
          document.head.insertBefore(base, document.head.firstChild);
        }
      } catch (e) {}
    })();
  </script>
  <title>Home — Cedar</title>
  <meta name="description" content="A focused, offline-first WYSIWYG authoring and static blog publishing tool.">
  <link rel="icon" type="image/x-icon" href="icon.ico">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="css/fonts.css?v=6.6.27">
  <link rel="stylesheet" href="style.css?v=6.6.35">
  <link rel="stylesheet" href="css/editor.css?v=6.6.27">
  <script>
    (function() {
      try {
        var params = new URLSearchParams(window.location.search);
        var urlTheme = params.get('theme');
        var theme = urlTheme || localStorage.getItem('cedar_theme') || localStorage.getItem('outpost_theme');
        var lightThemes = [
          'canvas_mono', 'canvas', 'chalk_frost', 'stone_linen', 'parchment_warm',
          'linen', 'stone', 'alabaster_sage', 'porcelain_slate', 'rose_crimson',
          'lavender_mist', 'solstice_warm', 'solar_warm', 'solar', 'oasis_moss',
          'oasis', 'riviera_azure', 'coast_azure', 'coast', 'peony_blush', 'peony',
          'desert_mirage', 'mirage', 'tropic'
        ];
        if (theme && lightThemes.indexOf(theme) !== -1) {
          document.documentElement.classList.add('app-theme-light');
        }
      } catch(e) {}
    })();
  </script>
</head>
