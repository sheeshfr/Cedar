      <div class="sidebar-header">
        <h2 class="sidebar-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          <span>Post Settings</span>
        </h2>
        <button type="button" class="sidebar-close-btn" id="btn-close-sidebar" title="Close Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>

      <div class="sidebar-body">
        <!-- Post Settings Notice Banner -->
        <div class="post-settings-notice" id="post-settings-notice" style="display: none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
          <div class="post-settings-notice-text">
            <strong>Post Settings Required</strong>
            <span>Please configure your post settings (title, slug, or category) before publishing.</span>
          </div>
        </div>

        <!-- View Mode Toggle (See Code / See Post) -->
        <div class="form-group" style="margin-bottom: 0.35rem;">
          <button type="button" class="btn-sidebar-mode-toggle" id="btn-toggle-editor-mode" title="Toggle between Canvas and Markdown Code View (Ctrl+M)">
            <svg class="mode-icon-code" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
            <svg class="mode-icon-post" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
            <span id="label-sidebar-mode-toggle">See Code</span>
          </button>
        </div>

        <!-- Basic Info -->
        <div class="form-group">
          <label for="meta-title" class="form-label">Article Title <span class="required">*</span></label>
          <input type="text" id="meta-title" class="form-input" placeholder="Title...">
        </div>

        <div class="form-group">
          <label for="meta-subtitle" class="form-label">Subtitle / Excerpt</label>
          <textarea id="meta-subtitle" class="form-textarea form-textarea-sm" placeholder="Subtitle..."></textarea>
        </div>

        <div class="form-group">
          <div style="display: flex; align-items: center; justify-content: space-between;">
            <label for="meta-slug" class="form-label" style="margin-bottom: 0;">Canonical URL Slug</label>
          </div>
          <div class="input-with-prefix" style="margin-top: 0.35rem;">
            <span class="input-prefix" id="workspace-url-prefix">/uncategorized/</span>
            <input type="text" id="meta-slug" class="form-input" placeholder="article-title-slug">
            <span class="input-suffix">/</span>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group flex-1">
            <label for="meta-date" class="form-label">Publish Date</label>
            <input type="date" id="meta-date" class="form-input">
          </div>
          <div class="form-group flex-1">
            <label for="meta-tag" class="form-label">Category</label>
            <select id="meta-tag" class="form-input">
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group flex-1">
            <label for="meta-author-name" class="form-label">Author Name</label>
            <input type="text" id="meta-author-name" class="form-input" placeholder="Author name">
          </div>
          <div class="form-group" style="width: 75px;">
            <label for="meta-author-initial" class="form-label">Avatar</label>
            <input type="text" id="meta-author-initial" class="form-input text-center" maxlength="2" placeholder="A">
          </div>
        </div>

        <!-- Cover Image -->
        <div class="form-group">
          <label for="meta-cover-image" class="form-label">
            <span>Cover Image URL</span>
            <button type="button" class="btn-ghost" id="btn-pick-cover-image" style="font-size: 0.7rem; padding: 2px 4px; color: var(--accent-primary, #71717a);">Pick from Post</button>
          </label>
          <input type="text" id="meta-cover-image" class="form-input" placeholder="/blog/images/... or https://...">
          <div class="cover-image-preview-wrap" id="cover-preview-container" style="display: none;">
            <img id="cover-preview-img" src="" alt="Cover Preview" class="cover-preview-img">
            <button type="button" class="btn-clear-cover" id="btn-clear-cover" title="Remove Cover Image">&times;</button>
          </div>
        </div>

        <!-- Navigation Links (Prev/Next Articles) -->
        <div class="settings-accordion">
          <details class="accordion-item">
            <summary class="accordion-summary">
              <span>Adjacent Post Links (Older & Newer)</span>
              <svg class="chevron-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </summary>
            <div class="accordion-content">
              <div class="form-group">
                <label for="nav-prev-title" class="form-label">Older Article Title</label>
                <input type="text" id="nav-prev-title" class="form-input" placeholder="e.g. Previous Post Title">
              </div>
              <div class="form-group">
                <label for="nav-prev-slug" class="form-label">Older Article Slug</label>
                <input type="text" id="nav-prev-slug" class="form-input" placeholder="previous-post-slug">
              </div>
              <div class="form-group" style="margin-top: 0.5rem;">
                <label for="nav-next-title" class="form-label">Newer Article Title</label>
                <input type="text" id="nav-next-title" class="form-input" placeholder="e.g. Next Post Title">
              </div>
              <div class="form-group">
                <label for="nav-next-slug" class="form-label">Newer Article Slug</label>
                <input type="text" id="nav-next-slug" class="form-input" placeholder="next-post-slug">
              </div>
            </div>
          </details>

          <details class="accordion-item">
            <summary class="accordion-summary">
              <span>Advanced SEO & Overrides</span>
              <svg class="chevron-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </summary>
            <div class="accordion-content">
              <div class="form-group">
                <label for="meta-override-readtime" class="form-label">Manual Read Time Override</label>
                <input type="text" id="meta-override-readtime" class="form-input" placeholder="e.g. 5 min read">
              </div>
              <div class="form-group">
                <label for="meta-custom-desc" class="form-label">Meta Description</label>
                <textarea id="meta-custom-desc" class="form-textarea form-textarea-sm" placeholder="Defaults to Subtitle if left empty..."></textarea>
              </div>
            </div>
          </details>
        </div>

      </div>
    </aside>
  </div>
  <!-- Close #view-editor -->
  </div>
