      <!-- TAB: HOME (Feed & Event Log Stream) -->
      <section class="dash-pane active" id="pane-home">
        <!-- Standardized 3-Column Pane Header (Feed, Search Feed, Add Milestone) -->
        <div class="dash-pane-header standardized-pane-header">
          <div class="pane-header-left">
            <h2 class="dash-pane-title">Feed</h2>
          </div>
          <div class="pane-header-center">
            <div class="header-search-box">
              <svg viewBox="0 0 24 24" class="header-search-icon" style="width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              <input type="search" id="home-activity-search-input" class="header-search-input" placeholder="Search Feed" autocomplete="off">
            </div>
          </div>
          <div class="pane-header-right">
            <button type="button" class="btn btn-sm btn-primary" id="btn-home-add-milestone">+ Add Milestone</button>
          </div>
        </div>

        <div class="home-stream-container">
          <!-- Filter Bar: Activity Type Pills -->
          <div class="home-stream-filter-bar">
            <div class="home-filter-pills" role="tablist" aria-label="Feed Filter">
              <button type="button" class="home-filter-btn is-active" data-filter="all">All</button>
              <button type="button" class="home-filter-btn" data-filter="post">Posts</button>
              <button type="button" class="home-filter-btn" data-filter="page">Pages</button>
              <button type="button" class="home-filter-btn" data-filter="category">Categories</button>
                <button type="button" class="home-filter-btn" data-filter="milestone">Milestones</button>
            </div>
          </div>

          <!-- Future Releases Section (Only appears in the moment when scheduled posts exist) -->
          <div class="home-future-section" id="home-future-section" style="display: none;">
            <div class="home-future-header">
              <div class="home-future-title-group">
                <span class="home-future-icon" aria-hidden="true">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                  </svg>
                </span>
                <h3 class="home-future-title">Future</h3>
                <span class="home-future-badge" id="home-future-count">0</span>
              </div>
              <span class="home-future-hint">Scheduled for automatic release</span>
            </div>
            <div class="home-future-list" id="home-future-list">
              <!-- Dynamically populated scheduled post cards -->
            </div>
          </div>

          <!-- Vertical Activity Timeline List -->
          <div class="home-activity-timeline" id="home-activity-timeline">
            <!-- Dynamically populated activity cards and milestone lines -->
          </div>

          <!-- Empty State -->
          <div class="home-activity-empty" id="home-activity-empty" style="display: none;">
            <div class="home-empty-icon">📜</div>
            <h3 class="home-empty-title">No feed activity yet</h3>
            <p class="home-empty-desc">Everything you create, edit, or upload will automatically appear in this live feed.</p>
          </div>
        </div>

        <!-- Custom Milestone Modal (Create / Edit) -->
        <div class="modal-overlay" id="modal-milestone" style="display: none; z-index: 10035;" role="dialog" aria-modal="true" aria-labelledby="modal-milestone-title">
          <div class="modal-card modal-sm" style="border-radius: 12px;">
            <div class="modal-header" style="padding: 1.15rem 1.4rem 0.9rem 1.4rem; border-bottom: 1px solid var(--border-subtle, rgba(255, 255, 255, 0.08));">
              <h2 class="modal-title" id="modal-milestone-title" style="font-size: 1.18rem; font-weight: 700;">Add Milestone</h2>
              <button type="button" class="modal-close-btn" id="btn-close-milestone-modal" title="Close" aria-label="Close">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
              </button>
            </div>
            <form id="form-milestone" style="margin: 0; display: contents;">
              <input type="hidden" id="input-milestone-id" value="">
              <div class="modal-body" style="display: flex; flex-direction: column; gap: 0 !important; padding: 1.15rem 1.4rem 1rem 1.4rem !important;">
                <div class="setup-group" style="margin-bottom: 0 !important; gap: 0 !important;">
                  <label class="setup-label" for="textarea-milestone-text" style="display: block; margin-bottom: 0.35rem;">Milestone Note <span style="color: var(--accent-primary, #ef4444);">*</span></label>
                  <textarea class="setup-input form-textarea" id="textarea-milestone-text" rows="2" maxlength="40" placeholder="What milestone was achieved? (max 40 characters)" required style="resize: vertical; min-height: 65px; font-family: inherit; font-size: 0.92rem; margin-bottom: 0 !important;"></textarea>
                  <div class="milestone-counter-wrap" style="display: flex; justify-content: flex-end; margin-top: 4px; margin-bottom: 0; line-height: 1;">
                    <span id="milestone-char-counter" style="font-size: 0.75rem; color: var(--text-muted, #71717a); font-variant-numeric: tabular-nums;">0 / 40</span>
                  </div>
                </div>

                <div class="setup-group milestone-date-group" style="margin-top: 1rem !important; margin-bottom: 0 !important; gap: 0 !important; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%;">
                  <label class="setup-label" for="input-milestone-date" style="text-align: center; margin-bottom: 4px;">Date</label>
                  <input type="date" class="setup-input form-input" id="input-milestone-date" style="width: auto; min-width: 220px; text-align: center;">
                </div>

                <p class="milestone-privacy-note" id="milestone-privacy-note" style="margin: 0.95rem 0 0 0; font-size: 0.78rem; color: var(--text-muted, #a1a1aa); text-align: center; line-height: 1.4;">
                  Note: The public won't see milestones — they're strictly for the author.
                </p>
              </div>

              <div class="modal-footer" style="display: flex; justify-content: flex-end; align-items: center; gap: 0.6rem; padding: 1rem 1.4rem 1.15rem 1.4rem; border-top: 1px solid var(--border-subtle, rgba(255, 255, 255, 0.08));">
                <button type="button" class="btn" id="btn-delete-milestone-modal" style="display: none; margin-right: auto; background: transparent; color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.35); font-size: 0.84rem; padding: 0.45rem 0.85rem; border-radius: 6px; cursor: pointer;">Delete</button>
                <button type="button" class="btn btn-secondary" id="btn-cancel-milestone">Cancel</button>
                <button type="submit" class="btn btn-primary" id="btn-save-milestone">Save Milestone</button>
              </div>
            </form>
          </div>
        </div>

        <!-- Overlapping Home Image Lightbox Preview Modal -->
        <div class="home-image-lightbox-overlay" id="home-image-lightbox" style="display: none;" role="dialog" aria-modal="true" aria-label="Image Preview">
          <div class="home-lightbox-backdrop" id="home-lightbox-backdrop"></div>
          <div class="home-lightbox-dialog">
            <button type="button" class="home-lightbox-close-btn" id="btn-home-lightbox-close" title="Close Preview (Esc)" aria-label="Close Preview">&times;</button>
            <div class="home-lightbox-img-wrap">
              <img id="home-lightbox-img" src="" alt="Media Preview" class="home-lightbox-img">
            </div>
            <div class="home-lightbox-caption" id="home-lightbox-caption"></div>
          </div>
        </div>
      </section>
