      <section class="dash-pane" id="pane-posts" style="display: none;">

<div class="dash-pane-header standardized-pane-header">

<div class="pane-header-left">

<h2 class="dash-pane-title">Posts</h2>

</div>

<div class="pane-header-center">

<div class="header-search-box">

<svg viewBox="0 0 24 24" class="header-search-icon" style="width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>

<input type="search" id="posts-search-input" class="header-search-input" placeholder="Search Posts" autocomplete="off">

</div>

</div>

<div class="pane-header-right" style="display: flex; align-items: center; gap: 0.75rem;">

<div class="posts-category-filter-box">

<select id="posts-category-filter" class="posts-category-filter-select" aria-label="Filter posts by category">

<option value="">All Categories</option>

</select>

<svg class="posts-category-filter-arrow" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

<polyline points="6 9 12 15 18 9"></polyline>

</svg>

</div>

<button type="button" class="btn btn-sm btn-primary" id="btn-posts-new-draft">+ New Post</button>

</div>

</div>

<!-- 1. OVERVIEW VIEW: Horizontal Sections (Drafts, Published, Hidden) -->

<div class="posts-overview-container" id="posts-overview-container">

<!-- Drafts Section -->

<div class="posts-horizontal-section section-drafts">

<div class="posts-section-header">

<div class="section-title-wrap">

<span class="col-dot dot-draft"></span>

<h3 class="section-title">Drafts</h3>

<span class="posts-section-count" id="posts-overview-count-drafts">0</span>

</div>

<div class="posts-section-actions">

<a class="posts-section-more-btn" href="#drafts" data-posts-sub-link="drafts">

Show More &rarr;

</a>

</div>

</div>

<div class="posts-horizontal-grid" id="posts-cards-drafts">

<!-- Dynamically populated up to 3 drafts + Show More card -->

</div>

</div>

<!-- Published Section -->

<div class="posts-horizontal-section section-published">

<div class="posts-section-header">

<div class="section-title-wrap">

<span class="col-dot dot-published"></span>

<h3 class="section-title">Published</h3>

<span class="posts-section-count" id="posts-overview-count-published">0</span>

</div>

<div class="posts-section-actions">

<a class="posts-section-more-btn" href="#published" data-posts-sub-link="published">

Show More &rarr;

</a>

</div>

</div>

<div class="posts-horizontal-grid" id="posts-cards-published">

<!-- Dynamically populated up to 10 published posts + Show More card -->

</div>

</div>

</div>

<!-- 2. INDEPENDENT SUBPAGE VIEW (Drafts, Published, Hidden) -->

<div class="posts-overview-container posts-subpage-container" id="posts-subpage-container" style="display: none;">

<div class="posts-horizontal-section">

<div class="posts-section-header">

<div class="section-title-wrap">

<span class="col-dot" id="posts-subpage-dot"></span>

<h3 class="section-title" id="posts-subpage-heading">Drafts</h3>

<span class="posts-section-count" id="posts-subpage-count">0</span>

</div>

<div class="posts-section-actions">

<a class="posts-section-more-btn" id="btn-posts-subpage-back" href="#posts" data-posts-sub-link="all">

&larr; Back to Posts

</a>

</div>

</div>

<div class="posts-horizontal-grid" id="posts-cards-subpage">

<!-- Full paginated list of cards for this subpage -->

</div>

</div>

</div>

</section>
